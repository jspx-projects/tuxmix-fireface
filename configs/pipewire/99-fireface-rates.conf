# PipeWire clock rates for the RME Fireface family.
#
# Install as:
#   ~/.config/pipewire/pipewire.conf.d/99-fireface-rates.conf
# then restart PipeWire (or log out and back in).
#
# These are the rates the Fireface transport core understands.  Each
# device descriptor still limits its own card (UC/UCX and Babyface Pro FS
# are 32-192 kHz); the wider tail exists so the same module can describe
# future RME units up to 768 kHz without changing the host graph config.
context.properties = {
    default.clock.allowed-rates = [
        32000 44100 48000 64000 88200 96000 128000 176400 192000
        352800 384000 705600 768000
    ]
}
