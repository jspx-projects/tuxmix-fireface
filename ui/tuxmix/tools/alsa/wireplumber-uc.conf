# RME Fireface UC: Pro Audio node tuning.
# Install as ~/.config/wireplumber/wireplumber.conf.d/60-fireface-uc.conf.
#
# Polled/IRQ scheduling; the graph quantum owns the ALSA period.  TuxMix's
# buffer picker sets that quantum and reaches the card at 48 samples and
# above.  Two ALSA periods are the minimum; the driver raises the ring to
# cover its two 48-frame URBs plus margin.  The UC endpoint holds one more
# 48-frame packet.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_(output|input).*Fireface.*pro-.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        api.alsa.auto-link = false
        api.alsa.period-num = 2
      }
    }
  }
]

# Prefer the 18-channel Pro Audio profile for every Fireface.  TuxMix is a
# control-only mixer; the 18-channel Pro Audio nodes are its audio path.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*Fireface.*" }
    ]
    actions = {
      update-props = {
        priorities = [
          "pro-audio",
          "output:stereo-fallback+input:stereo-fallback",
          "output:stereo-fallback",
          "input:stereo-fallback"
        ]
      }
    }
  }
]
